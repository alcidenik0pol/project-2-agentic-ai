CORS_ORIGINS: "https://agenticaicolumbia-fb.web.app,http://localhost:3456,http://127.0.0.1:3456"
# Runtime environment: enables token tracking and monthly limits in prod.
# Omit (or set to "development") locally to disable both.
APP_ENV: "production"
LLM_PROVIDER: "gcloud"
GCLOUD_PROJECT: "AgenticAIColumbia"
GCLOUD_REGION: "us-central1"
GCLOUD_MODEL: "gemini-2.5-pro"
GCLOUD_MODEL_FAST: "gemini-2.5-flash"
GCLOUD_TIMEOUT: "60"
CLASSIFICATION_REQUEST_TIMEOUT: "60"
# Usage tracking (Gemini token limits)
USAGE_LIMIT_TOKENS: "1000000"
USAGE_STORAGE_BUCKET: "painpan-usage"
# Datasets bucket (mounted read-only at /app/data via Cloud Run volume)
DATASETS_BUCKET: "painpan-datasets"
# PROXY_ENABLED and PROXY_URL are set via Google Secret Manager, not here
# gcloud run services update painpan-backend --set-secrets="PROXY_URL=proxy-url:latest,PROXY_ENABLED=proxy-enabled:latest"
