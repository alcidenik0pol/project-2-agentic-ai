steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/painpan/frontend:$SHORT_SHA'
      - '-f'
      - 'frontend/Dockerfile'
      - 'frontend'
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/painpan/frontend:$SHORT_SHA'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/painpan/frontend:$SHORT_SHA'
